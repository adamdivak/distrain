4); fill-opacity: 1; white-space: pre;">Price of that one run</text></g></g></g><g class="annotation" data-index="1" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,636.46,103.10000000000002)"><g class="cursor-pointer" transform="translate(451,81)"><rect class="bg" x="0.5" y="0.5" width="369" height="44" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="end" x="368.28125" y="12" style="font-family: Arial, sans-serif; font-size: 11px; fill: rgb(85, 85, 85); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="368.28125" y="12">Eight A100s over NVLink cost about what one A100 costs for the same run:</tspan><tspan class="line" dy="1.3em" x="368.28125" y="12">the rate is 8× but the hours are 7.66× fewer. Scaling is nearly free</tspan><tspan class="line" dy="2.6em" x="368.28125" y="12">here — it is the slower fabrics, further on, that are not.</tspan></text></g></g></g></g></svg>