[project]
name = "distrain"
version = "0.1.0"
description = "Distributed training scaling study: hand-rolled DDP / FSDP2 / DiLoCo on a nanoGPT-style pretraining loop"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.13.0",
    "numpy==2.5.1",
    "tiktoken==0.13.0",
    "trackio[gpu]==0.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# only needed to run reference/modded_nanogpt/cached_fineweb10B.py, which pulls
# the real FineWeb shards. Not required for local development on synthetic data.
data = [
    "huggingface-hub",
]
plots = [
    "plotly>=6.3,<7",
    "kaleido>=1.0,<2",
    "pandas>=2.3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distrain"]

[tool.uv]
# Use uv's own CPython rather than whatever the distro ships. Two reasons: the
# managed builds include the development headers Triton needs to JIT-compile
# torch.compile kernels (Ubuntu splits those into python3-dev, which needs root),
# and pinning the interpreter is part of keeping the environment identical across
# the Mac, aurora and rented nodes.
python-preference = "only-managed"

# torch comes from PyPI on macOS (CPU/MPS, for local development only) and from
# the CUDA wheel index on Linux (aurora + rented cloud nodes).
#
# cu126 is pinned rather than cu130 because it has the widest NVIDIA driver
# compatibility and aurora's driver version is not yet confirmed. Bump to cu130
# once it is -- see docs/decisions.md.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# vendored third-party code, kept verbatim -- see reference/PROVENANCE.md
extend-exclude = ["reference"]
